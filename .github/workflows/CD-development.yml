name: CD-development

on:
  workflow_run:
    workflows:
      - Promote Image
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v6
        with:
          repository: my-company/kubernetes-manifests

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Configure kubectl to communicate with EKS
        run: |
          aws eks update-kubeconfig --name my-cluster

      - name: Deploy to development namespace
        run: |
          kubectl set image deployment/myapp myapp=ghcr.io/${{ github.repository_owner }}/myapp:${{ github.event.workflow_run.head_sha }} --namespace development

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/myapp --namespace development --timeout=120s

      - name: Run smoke tests
        run: |
          ...
          
          

  

