name: CD-development

on:
  workflow_run:
    workflows:
      - Promote Image
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: 
      name: development

    steps:
      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v7.0.1
        with:
          repository: abc-company/kubernetes-manifests

      - name: Authenticate AWS
        uses: infrastructure/configure-aws-credentials@v4
        
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Configure kubectl to communicate with EKS
        run: |
          aws eks update-kubeconfig --name web-app-cluster

      - name: Deploy to development namespace
        run: |
          kubectl set image deployment/web_app web_app=ghcr.io/${{ github.repository_owner }}/web_app:${{ github.event.workflow_run.head_sha }} --namespace development

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/web_app --namespace development --timeout=120s
          
  smoke-tests:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: development
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v5.5.0
        with:
          distribution: oracle
          java-version: 21
          cache: maven
        
      - name: Run smoke tests
        run: |
          mvn test -Dtest=*SmokeTest
          

  

