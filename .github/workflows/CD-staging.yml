name: CD-staging

on:
  workflow_run:
    workflows:
      - CD-development
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout Kubernetes manifests
        uses: actions/checkout@vv7.0.1
        with:
          repository: infrastructure-repo/kubernetes-manifests

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name web-app-cluster

      - name: Deploy to staging environment
        run: |
          kubectl set image deployment/web_app web_app=ghcr.io/${{ github.repository_owner }}/web_app:${{ github.event.workflow_run.head_sha }} --namespace staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/web_app --namespace staging --timeout=120s
  smoke-tests:
      runs-on: ubuntu-latest
      environment:
        name: staging
      needs: deploy
      
      steps:
        - name: Checkout repository
          uses: actions/checkout@v7.0.1

        - name: Set Up JDK
          uses: actions/setup-java@v5.5.0
          with:
            distribution: oracle
            java-version: 21
            cache: maven
            
        - name: Run smoke tests
          run: |
            mvn test -Dtest=*SmokeTest
    
  e2e-tests:
      runs-on: ubuntu-latest
      environment:
        name: staging
      needs: smoke-tests
      
      steps:
        - name: Checkout
          uses: actions/checkout@v7.0.1

        - name: Set Up JDK
          uses: actions/setup-java@v5.5.0
          with:
            distribution: oracle
            java-version: 21
            cache: maven
        
        - name: Run end-to-end tests
          run: |
            mvn test -Dtest=*E2ETest
            
  load-tests:
    runs-on: ubuntu-latest
    environment:
      name: staging
    needs: e2e-tests
      
    steps:
      - name: Run load tests
        id: enterprise-action
        uses: gatling/enterprise-action@v1.1.1
        with:
          api_token: ${{ secrets.GATLING_ENTERPRISE_API_TOKEN }}
          simulation_id: ${{ secrets.SIMULATION_ID }}
      - run: |
          echo "Gatling report URL: ${{ steps.enterprise-action.outputs.reports_url }}"

  rollback:
    needs: [deploy, smoke-tests, e2e-tests, load-tests]
    if: always() && (needs.smoke-tests.result == 'failure' || needs.e2e-tests.result == 'failure' || needs.load-tests.result == 'failure')
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
          
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name web-app-cluster

      - name: Roll back deployment
        run: |
          kubectl rollout undo deployment/web_app --namespace staging

      - name: Wait for rollback
        run: |
          kubectl rollout status deployment/web_app --namespace staging --timeout=120s

      - name: Inform about the execution
        run: |
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Smoke: ${{ needs.smoke-tests.result }}"
          echo "E2E: ${{ needs.e2e-tests.result }}"
          echo "Load: ${{ needs.load-tests.result }}"
