
name: CI

on:
  pull_request:
    branches: [ 'development' ]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Up JDK
        uses: actions/setup-java@v5.5.0
        with:
          distribution: oracle
          java-version: 21
          cache: maven

      - name: Build and Test
        run: mvn clean test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master

  build-container-and-integration-tests:        
    needs: build-and-test
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:test
        env:
          MYSQL_USER: ${{secrets.MYSQL_USER}}
          MYSQL_PASSWORD: ${{secrets.MYSQL_PASSWORD}}
          MYSQL_DB: ${{secrets.MYSQL_DB}}
        ports:
          - 3306:3306
    
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

        # Setting up Buildx action is not necessary, but recommended by the Docker's official GitHub Action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
          
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
              ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}-pr

      - name: Run application container
        run: |
          docker run -d --name myapp -p 8080:8080 ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}-pr

      - name: Run integration tests
        run: |
          mvn verify

      - name: Push tested image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}-pr

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
          # Paths where analysis and testing results are stored
      
        
      
