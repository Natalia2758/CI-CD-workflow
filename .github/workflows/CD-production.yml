name: CD-production

on:
  workflow_run:
    workflows:
      - CD-staging
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: 
      name: production
      # Production environment is configured with review required option, therefore this job only runs after receiving approval

    steps:
      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v6
        with:
          repository: abc-company/kubernetes-manifests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name web-app-cluster

      - name: Deploy to production environment
        run: |
          kubectl set image deployment/web_app web_app=ghcr.io/${{ github.repository_owner }}/web_app:${{ github.event.workflow_run.head_sha }} -n production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/web_app -n production
  smoke-tests:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run smoke tests
        run: |
          mvn test -Dtest=*SmokeTest
          
          
