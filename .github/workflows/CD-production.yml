name: CD-production

on:
  workflow_run:
    workflows:
      - CD-staging
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: 
      name: production
      # Production environment is configured with review required option, therefore this job only runs after receiving approval

    steps:
      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v7.0.1
        with:
          repository: abc-company/kubernetes-manifests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name web-app-cluster

      - name: Deploy to production environment
        run: |
          kubectl set image deployment/web_app web_app=ghcr.io/${{ github.repository_owner }}/web_app:${{ github.event.workflow_run.head_sha }} -n production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/web_app -n production
  smoke-tests:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set Up JDK
        uses: actions/setup-java@v5.5.0
        with:
          distribution: oracle
          java-version: 21
          cache: maven
          
      - name: Run smoke tests
        run: |
          mvn test -Dtest=*SmokeTest
          
  rollback:
    needs: [deploy, smoke-tests]
    if: always() && needs.smoke-tests.result == 'failure'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
          
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name web-app-cluster

      - name: Roll back deployment
        run: |
          kubectl rollout undo deployment/web_app --namespace production

      - name: Wait for rollback
        run: |
          kubectl rollout status deployment/web_app --namespace production --timeout=120s
  

      - name: Notify about the rollback
        run: |
          echo "Deployment was rolled back - deployment or smoke tests failure"   


  merge-to-production:
    needs: [deploy, smoke-tests]
    if: success()

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # needed for merging
      - name: Configure Git
        run: |
          git config user.name "CD-production: automatic merge into production"
          git config user.email "github-actions-bot@noreply.github.com"

      - name: Merge development branch into production
        run: |
          git fetch origin
          git checkout production
          git merge origin/development -message "Release ${{ github.event.workflow_run.head_sha }}"
          git push origin production
